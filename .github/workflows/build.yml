name: Prüfen und APK bauen

on:
  push:
    branches: [main]
    paths-ignore: ['assets/data/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # für das Release mit der APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Plattform-Ordner erzeugen (nur falls noch nicht im Repo)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,ios --org ch.dwidmer --project-name lotto_vorschlag .
            rm -f test/widget_test.dart
          fi
      - name: App-Symbole übernehmen (aus branding/, erzeugt mit tools/build_icons.py)
        run: |
          cp -r branding/android/res/. android/app/src/main/res/
          if [ -d ios/Runner/Assets.xcassets/AppIcon.appiconset ]; then
            cp branding/ios/AppIcon.appiconset/*.png ios/Runner/Assets.xcassets/AppIcon.appiconset/
          fi
      - name: Internet-Berechtigung (fehlt in der Flutter-Vorlage für Release-Builds)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          grep -n 'INTERNET' "$M"
      - name: App-Name unter dem Symbol
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Zahlenfee"/' android/app/src/main/AndroidManifest.xml
          if [ -f ios/Runner/Info.plist ]; then
            /usr/bin/python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('ios/Runner/Info.plist'); s = p.read_text()
          s = re.sub(r'(<key>CFBundleDisplayName</key>\s*<string>)[^<]*', r'\1Zahlenfee', s)
          p.write_text(s)
          PY
          fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Fester Signaturschlüssel (sonst lässt Android kein Update über die alte Version zu)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secret ANDROID_DEBUG_KEYSTORE fehlt – APK wird mit wechselndem Schlüssel signiert, Updates schlagen fehl."
          else
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi
      - name: APK bauen (Version 0.1.<Laufnummer>)
        run: |
          flutter build apk --release --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk zahlenfee.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zahlenfee-apk
          path: zahlenfee.apk
      - name: Release veröffentlichen (für das Update in der App)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Zahlenfee 0.1.${{ github.run_number }}
          files: zahlenfee.apk
          make_latest: true
