name: Ziehungsdaten aktualisieren

on:
  schedule:
    # täglich 07:15 UTC – neue Ziehungen sind damit spätestens am Folgetag drin
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Neue Ziehungen holen
        run: python tools/update_data.py --data assets/data
      - name: Commit, falls sich etwas geändert hat
        run: |
          if git diff --quiet; then echo "Keine neuen Ziehungen"; exit 0; fi
          git config user.name "lotto-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "Ziehungsdaten $(date -u +%F)"
          git push
